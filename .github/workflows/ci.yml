name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux x64
          - os: ubuntu-24.04-arm
            name: Linux ARM64
          - os: windows-latest
            name: Windows x64
          - os: windows-11-arm
            name: Windows ARM64
          - os: macos-latest
            name: macOS ARM64

    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Verify no private URLs in package-lock.json
        shell: bash
        run: '! grep -E "\"resolved\": \"https?://" package-lock.json | grep -v registry.npmjs.org'

      - name: Verify example dependency versions
        shell: bash
        run: node scripts/check-versions.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      - run: npm run build

      - run: npm run examples:build

      - name: Verify generated schemas are up-to-date
        shell: bash
        run: |
          npm run generate:schemas
          git diff --exit-code src/generated/ || (echo "Generated schemas are out of date. Run 'npm run generate:schemas' and commit." && exit 1)

      - name: Verify synced snippets are up-to-date
        shell: bash
        run: |
          npm run sync:snippets
          git diff --exit-code src/ docs/ || (echo "Synced snippets are out of date. Run 'npm run sync:snippets' and commit." && exit 1)

      - run: npm test

      - run: npm run prettier

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit for vulnerabilities
        run: |
          echo "=== Running npm audit on all 29 dependencies ==="
          echo "Scanning: @modelcontextprotocol/sdk, cheerio, react, express, playwright, and 24 other packages"
          npm audit --audit-level=moderate --json > audit-results.json || true
          
          if [ -s audit-results.json ]; then
            echo "✓ Security audit completed"
            VULN_COUNT=$(cat audit-results.json | grep -o '"total":[0-9]*' | head -1 | grep -o '[0-9]*' || echo "0")
            echo "Vulnerabilities found: $VULN_COUNT"
            
            if [ "$VULN_COUNT" -gt "0" ]; then
              echo "⚠️  Vulnerabilities detected - review required"
              cat audit-results.json
            else
              echo "✓ No vulnerabilities found"
            fi
          fi

      - name: Verify package-lock.json integrity
        run: |
          echo "=== Verifying package-lock.json integrity hashes ==="
          if grep -q "\"integrity\":" package-lock.json; then
            echo "✓ Integrity hashes present in package-lock.json"
            HASH_COUNT=$(grep -c "\"integrity\":" package-lock.json || echo "0")
            echo "Found $HASH_COUNT integrity hashes protecting dependencies"
          else
            echo "⚠️  No integrity hashes found"
            exit 1
          fi

      - name: Check for outdated dependencies
        run: |
          echo "=== Checking for outdated dependencies ==="
          npm outdated || true
          echo "✓ Dependency freshness check completed"

      - name: Upload audit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-audit-results
          path: audit-results.json
          retention-days: 30

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: astral-sh/setup-uv@v5

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test --reporter=list

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  # Test build in Windows WSL (Ubuntu)
  build-wsl:
    name: Build (Windows WSL)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: Vampire/setup-wsl@v5
        with:
          distribution: Ubuntu-24.04

      - name: Install Node.js in WSL
        shell: wsl-bash {0}
        run: |
          sudo apt-get update
          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
          sudo apt-get install -y nodejs

      - name: Build and test in WSL
        shell: wsl-bash {0}
        run: |
          npm install
          npm run build
          npm run examples:build
          npm test
          npm run prettier

  # Test that the package can be installed from git (triggers prepare script)
  test-git-install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux x64
          - os: ubuntu-24.04-arm
            name: Linux ARM64
          - os: windows-latest
            name: Windows x64
          - os: windows-11-arm
            name: Windows ARM64
          - os: macos-latest
            name: macOS ARM64

    name: Test git install (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Create test project and install from git
        shell: bash
        run: |
          mkdir test-project
          cd test-project
          npm init -y
          # Install from the PR branch (use head repo for fork PRs)
          npm install "git+https://github.com/${{ github.event.pull_request.head.repo.full_name || github.repository }}#${{ github.head_ref || github.ref_name }}"
          # Verify the package is usable (ESM import)
          node --input-type=module -e "import { App } from '@modelcontextprotocol/ext-apps'; console.log('Import successful:', typeof App)"

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CesiumJS Globe</title>
    <!-- MCP UI CSP metadata - parsed by host before loading -->
    <script type="application/json" id="mcp-ui-csp">{
        "connectDomains": [
            "https://tile.openstreetmap.org",
            "https://*.tile.openstreetmap.org",
            "https://cesium.com",
            "https://*.cesium.com",
            "https://assets.cesium.com",
            "https://api.cesium.com"
        ],
        "resourceDomains": [
            "https://tile.openstreetmap.org",
            "https://*.tile.openstreetmap.org",
            "https://cesium.com",
            "https://*.cesium.com"
        ]
    }</script>
    <!-- CesiumJS is loaded dynamically from CDN in mcp-app.ts because static
         <script src=""> tags don't work in srcdoc iframes -->
    <style>
        html, body, #cesiumContainer {
            width: 100%;
            height: 100%;
            min-height: 400px;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #label {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            z-index: 1000;
            display: none;
            max-width: 300px;
            word-wrap: break-word;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 20px 30px;
            border-radius: 8px;
            font-size: 16px;
            z-index: 1001;
        }
    </style>
</head>
<body>
    <div id="cesiumContainer"></div>
    <div id="label"></div>
    <div id="loading">Loading globe...</div>
    <script type="module" src="/src/mcp-app.ts"></script>
</body>
</html>
